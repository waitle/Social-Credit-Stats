<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주문 통계</title>
<link rel="stylesheet" href="common.css">
<style>
  body{width:350px;padding:14px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  header #upd{margin-left:auto;font-size:11.5px}
  /* 알리 / 타오바오 전환 */
  .site{display:inline-flex;padding:2px;border-radius:999px;background:var(--card);border:1px solid var(--bd)}
  .site button{font:inherit;font-size:12px;border:0;background:none;color:var(--mu);padding:3px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .site button.on{background:var(--ac);color:#fff;font-weight:600}
  .site button b{font-weight:600;margin-left:3px;opacity:.85}
  .actions{display:flex;gap:6px;margin-top:12px}
  .actions .b{flex:1}
  .empty{color:var(--mu);text-align:center;padding:18px 0}
</style>
</head>
<body>
<header><h1>주문 통계</h1>
  <div class="site" role="tablist" aria-label="사이트 선택">
    <button role="tab" data-site="ali" id="s-ali">알리</button><button role="tab" data-site="taobao" id="s-taobao">타오바오</button>
  </div>
  <span class="muted" id="upd"></span></header>
<div id="body"><div class="empty">불러오는 중…</div></div>
<div class="actions">
  <button class="b pri" id="open">주문 페이지</button>
  <button class="b" id="refresh">지금 갱신</button>
  <button class="b" id="opts">설정</button>
</div>
<div class="status" id="status"></div>
<script src="../lib/core.js"></script>
<script src="../lib/extract.js"></script>
<script src="../lib/stats.js"></script>
<script src="../lib/taobao.js"></script>
<script src="../content/format.js"></script>
<script src="popup.js"></script>
</body>
</html>
