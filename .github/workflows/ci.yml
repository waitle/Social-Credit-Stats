name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: 파서/통계 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  server:
    name: 중앙 서버 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false   # 외부 의존성이 없어 go.sum 이 없다
      - run: test -z "$(gofmt -l server)"
      - run: npm run test:server

  e2e:
    name: 확장 E2E (Chromium)
    runs-on: ubuntu-latest
    needs: [unit, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false   # 외부 의존성이 없어 go.sum 이 없다
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
